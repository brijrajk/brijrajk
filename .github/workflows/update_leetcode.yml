name: 🧩 Update LeetCode Profile SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_leetcode_svg.py"

jobs:
  update-leetcode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🎨 Generate SVG
        run: python scripts/generate_leetcode_svg.py

      - name: 📤 Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-profile.svg README.md
          git diff --cached --quiet || git commit -m "chore: 🧩 auto-update LeetCode SVG [skip ci]"
          git push
